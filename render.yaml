services:
  - type: web
    name: crm-data-cleaner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CRM_AUTH_DISABLED
        value: "false"
      - key: CRM_API_KEYS
        sync: false
      - key: CRM_USAGE_LOG_PATH
        value: logs/usage.jsonl
      - key: CRM_MAX_JSON_BYTES
        value: "10485760"
      - key: CRM_MAX_CSV_BYTES
        value: "5242880"
